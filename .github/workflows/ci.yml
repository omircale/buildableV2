name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Types
        run: npx tsc -b
      - name: Lint
        run: npm run lint
      - name: Tests (engine, audits, UI)
        run: npm test
      - name: Build
        run: npm run build
      - name: Dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=high
